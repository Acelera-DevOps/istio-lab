apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: payments-strict-mtls
  namespace: payments-mesh
  labels:
    app.kubernetes.io/part-of: acelera-devops-istio-lab
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: payments-zero-trust-rbac
  namespace: payments-mesh
  labels:
    app.kubernetes.io/part-of: acelera-devops-istio-lab
spec:
  selector:
    matchLabels:
      app: payments-service
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"
              - "cluster.local/ns/payments-mesh/sa/payments-sa"
              - "cluster.local/ns/payments-mesh/sa/default"
      to:
        - operation:
            methods: ["GET", "POST"]
            paths: ["/", "/healthz", "/api/v1/payments*"]
